name: Diagnose BuyrFlow Bridge Verify

on:
  push:
    branches:
      - buyrflow-capability-bridge
    paths:
      - .github/workflows/diagnose-buyrflow-bridge.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run canonical verifier quietly and print exact assertion context
        shell: bash
        run: |
          set +e
          node scripts/verify.mjs > /tmp/verify.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Canonical verifier failed. Assertion context:"
            grep -n -B 10 -A 20 -E 'not ok|AssertionError \[ERR_ASSERTION\]' /tmp/verify.log | tail -n 420 || true
            echo "--- verifier summary ---"
            grep -n -E '^── |FAILED|checks FAILED|checks passed' /tmp/verify.log | tail -n 80 || true
            exit "$status"
          fi
          echo "Canonical verifier passed."
