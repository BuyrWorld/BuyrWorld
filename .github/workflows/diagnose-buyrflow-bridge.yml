name: Diagnose BuyrFlow Bridge Verify

on:
  push:
    branches:
      - buyrflow-capability-bridge
    paths:
      - .github/workflows/diagnose-buyrflow-bridge.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run canonical verifier quietly and print only failure context
        shell: bash
        run: |
          set +e
          node scripts/verify.mjs > /tmp/verify.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Canonical verifier failed. Filtered failure context:"
            grep -n -E 'not ok|FAIL|FAILED|AssertionError|ERR_|error:|Error:' /tmp/verify.log | tail -n 120 || true
            echo "--- tail ---"
            tail -n 120 /tmp/verify.log
            exit "$status"
          fi
          echo "Canonical verifier passed."
