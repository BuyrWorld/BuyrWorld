name: Apply BuyrFlow Capability Bridge

on:
  push:
    branches:
      - buyrflow-capability-bridge
    paths:
      - scripts/apply-buyrflow-capability-bridge.py
      - .github/workflows/apply-buyrflow-capability-bridge.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bridge branch
        uses: actions/checkout@v4
        with:
          ref: buyrflow-capability-bridge
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bridge and governed inventory updates
        run: python3 scripts/apply-buyrflow-capability-bridge.py
      - name: Refresh native content fingerprint
        run: node scripts/bump-version.mjs

      # Keep the bridge-specific check visible, but the canonical repository
      # verifier below remains the release gate and is not weakened or replaced.
      - name: Verify bridge protocol
        run: node --test tests/unit/buyrflow-bridge.test.mjs
      - name: Run canonical full BuyrWorld verification
        run: node scripts/verify.mjs
      - name: Check patch integrity
        run: git diff --check
      - name: Commit generated review-branch changes only after every gate passes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/CURRENT_STATE.md docs/OWNER_HANDOVER.md docs/EVIDENCE.md
          git commit -m "feat: load governed BuyrFlow Should-Cost bridge"
          git push origin HEAD:buyrflow-capability-bridge
