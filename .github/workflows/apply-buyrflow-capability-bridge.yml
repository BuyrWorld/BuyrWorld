name: Apply BuyrFlow Capability Bridge

on:
  push:
    branches:
      - buyrflow-capability-bridge
    paths:
      - scripts/apply-buyrflow-capability-bridge.py
      - scripts/apply-buyrflow-capability-bridge.mjs
      - .github/workflows/apply-buyrflow-capability-bridge.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bridge branch
        uses: actions/checkout@v4
        with:
          ref: buyrflow-capability-bridge
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Insert external bridge module
        run: python3 scripts/apply-buyrflow-capability-bridge.py

      # Branch-only diagnostics. These do not replace scripts/verify.mjs; they
      # expose the exact failing gate in Actions step metadata when the combined
      # log is too large to retrieve through the review tooling.
      - name: Diagnostic — bridge unit tests
        continue-on-error: true
        run: node --test tests/unit/buyrflow-bridge.test.mjs
      - name: Diagnostic — complete unit suite
        continue-on-error: true
        shell: bash
        run: find tests/unit -type f -name '*.test.mjs' -print0 | sort -z | xargs -0 -r node --test
      - name: Diagnostic — integration suite
        continue-on-error: true
        shell: bash
        run: find tests/integration -type f -name '*.test.mjs' -print0 | sort -z | xargs -0 -r node --test
      - name: Diagnostic — security suite
        continue-on-error: true
        shell: bash
        run: find tests/security -type f -name '*.test.mjs' -print0 | sort -z | xargs -0 -r node --test
      - name: Diagnostic — python-facing suite
        continue-on-error: true
        shell: bash
        run: find tests/python -type f -name '*.test.mjs' -print0 | sort -z | xargs -0 -r node --test
      - name: Diagnostic — ProcureBench evaluation
        continue-on-error: true
        run: node scripts/eval.mjs
      - name: Diagnostic — claim extraction
        continue-on-error: true
        run: node scripts/eval-extraction.mjs
      - name: Diagnostic — drawing accuracy
        continue-on-error: true
        run: node scripts/eval-drawings.mjs
      - name: Diagnostic — prohibited content
        continue-on-error: true
        run: node scripts/verify-content.mjs
      - name: Diagnostic — serverless syntax
        continue-on-error: true
        run: node --check api/chat.js
      - name: Diagnostic — index integrity
        continue-on-error: true
        run: node scripts/verify-html.mjs

      - name: Run canonical full BuyrWorld verification
        run: node scripts/verify.mjs
      - name: Check patch integrity
        run: git diff --check
      - name: Commit only after the full suite passes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: load BuyrFlow capability bridge"
          git push origin HEAD:buyrflow-capability-bridge
