name: Apply BuyrFlow Capability Bridge

on:
  push:
    branches:
      - buyrflow-capability-bridge
    paths:
      - scripts/apply-buyrflow-capability-bridge.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bridge branch
        uses: actions/checkout@v4
        with:
          ref: buyrflow-capability-bridge
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Insert external bridge module
        run: python3 scripts/apply-buyrflow-capability-bridge.py
      - name: Run full BuyrWorld verification
        run: node scripts/verify.mjs
      - name: Check patch integrity
        run: git diff --check
      - name: Commit only after the full suite passes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: load BuyrFlow capability bridge"
          git push origin HEAD:buyrflow-capability-bridge
